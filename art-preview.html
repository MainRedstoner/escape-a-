<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 场景预览 · Escape A÷</title>
<style>
  :root{
    --void:#05070A; --ink:#0B0E13; --slate:#151A22; --slate2:#1E2530;
    --line:#2C3542; --steel:#46536A; --text:#C9D2DE; --muted:#7D8798;
    --clay:#D97757; --blue:#4D6BFE; --blue-pale:#A8BCFF; --gold:#C9A227;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% 0%, #0d1620 0%, #070b10 55%, #04060a 100%);
    color:var(--text);
    font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
    display:flex;flex-direction:column;height:100%;overflow:hidden;
  }
  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:center;gap:16px;
    padding:12px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(11,14,19,.96),rgba(11,14,19,.72));
    flex:0 0 auto;z-index:5;
  }
  header h1{
    font-family:"Noto Serif SC","SimSun",serif;
    font-size:20px;font-weight:700;letter-spacing:2px;color:#EDF2F9;
    white-space:nowrap;
  }
  header h1 b{color:var(--clay);}
  header .sub{font-size:12px;color:var(--muted);letter-spacing:1px;}
  header .spacer{flex:1;}
  .btn{
    background:rgba(11,14,19,.9);border:1px solid var(--line);color:var(--text);
    border-radius:4px;padding:6px 13px;font-size:13px;cursor:pointer;
    font-family:inherit;letter-spacing:.5px;transition:border-color .12s,color .12s,background .12s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--clay);color:#fff;}
  .btn.on{background:rgba(217,119,87,.16);border-color:var(--clay);color:#FFE3D7;}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.42;cursor:not-allowed;}
  .btn:disabled:hover{border-color:var(--line);color:var(--text);}
  header select{
    background:rgba(11,14,19,.9);border:1px solid var(--line);color:var(--text);
    border-radius:4px;padding:6px 6px;font-size:12px;cursor:pointer;font-family:inherit;
    letter-spacing:.5px;outline:none;transition:border-color .12s;
  }
  header select:hover{border-color:var(--clay);}
  header select:disabled{opacity:.42;cursor:not-allowed;}

  /* ---------- 主体 ---------- */
  main{flex:1;display:flex;min-height:0;}

  /* 侧栏 */
  #side{
    width:236px;flex:0 0 auto;overflow-y:auto;
    border-right:1px solid var(--line);
    background:rgba(8,11,16,.72);
    padding:10px 8px 24px;
  }
  #side .groupTitle{
    font-size:11px;color:var(--muted);letter-spacing:2px;
    padding:10px 10px 6px;text-transform:uppercase;
  }
  .sceneBtn{
    display:flex;gap:9px;align-items:center;width:100%;text-align:left;
    background:transparent;border:1px solid transparent;border-radius:4px;
    color:var(--text);padding:8px 10px;cursor:pointer;font-family:inherit;
    transition:background .12s,border-color .12s;
  }
  .sceneBtn:hover{background:rgba(44,53,66,.35);}
  .sceneBtn.on{background:rgba(217,119,87,.12);border-color:rgba(217,119,87,.55);}
  .sceneBtn .no{
    font-family:Consolas,monospace;font-size:11px;color:var(--muted);
    width:18px;flex:0 0 auto;text-align:right;
  }
  .sceneBtn.on .no{color:var(--clay);}
  .sceneBtn .nm{font-size:13.5px;line-height:1.35;}
  .sceneBtn .id{
    display:block;font-family:Consolas,monospace;font-size:11px;color:var(--muted);
    margin-top:2px;letter-spacing:.3px;
  }

  /* 舞台 */
  #view{
    flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;
    padding:18px 22px 12px;overflow:hidden;
  }
  #frame{
    position:relative;width:100%;max-width:1280px;aspect-ratio:16/9;
    background:#000;border:1px solid #202834;border-radius:3px;overflow:hidden;
    box-shadow:0 24px 80px rgba(0,0,0,.75);
  }
  #stage{display:block;width:100%;height:100%;cursor:grab;touch-action:none;}
  #stage:active{cursor:grabbing;}
  #caption{
    position:absolute;left:0;right:0;bottom:0;padding:26px 22px 14px;
    background:linear-gradient(0deg,rgba(3,5,8,.88),rgba(3,5,8,0));
    pointer-events:none;
  }
  #caption .t{
    font-size:19px;color:#F2F6FB;letter-spacing:1px;
    display:flex;align-items:baseline;gap:10px;
  }
  #caption .t code{font-family:Consolas,monospace;font-size:12px;color:var(--blue-pale);letter-spacing:0;}
  #caption .d{font-size:13px;color:#9AA9BC;margin-top:5px;letter-spacing:.3px;}
  body.clean #caption,body.clean header,body.clean #side,body.clean #status{display:none;}
  body.clean #view{padding:0;}
  body.clean #frame{max-width:none;width:auto;height:100%;aspect-ratio:16/9;border:none;border-radius:0;box-shadow:none;}

  /* 底栏 */
  #status{
    flex:0 0 auto;display:flex;align-items:center;gap:18px;
    padding:7px 22px;border-top:1px solid var(--line);
    font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px;color:var(--muted);
    background:rgba(8,11,16,.8);
  }
  #status b{color:#B9C7D8;font-weight:600;}
  #status .ok{color:#6FB58A;}
  #status .bad{color:#D9534F;}
  #status .keys{margin-left:auto;letter-spacing:.4px;}

  /* 纯净模式下的调试角标：画面留空，但读数还在——截图对比、弱机现场看帧率都要它。
     ?perf=1 时非纯净模式也显示；P 键或 ?perf=0 可以彻底关掉。 */
  #perfBadge{
    position:fixed;left:10px;top:10px;z-index:40;display:none;pointer-events:none;
    background:rgba(4,7,11,.84);border:1px solid var(--line);border-radius:4px;
    font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px;line-height:1.55;
    color:#B9C7D8;padding:6px 9px;white-space:pre;
  }
  body.clean #perfBadge{display:block;}
  body.want-perf #perfBadge{display:block;}
  body.hide-perf #perfBadge{display:none !important;}

  /* 全部场景 */
  #grid{
    position:absolute;inset:0;z-index:9;display:none;overflow-y:auto;
    background:rgba(4,6,9,.965);padding:26px 30px 40px;
  }
  #grid.show{display:block;}
  #gridHead{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  #gridHead .ttl{font-family:"Noto Serif SC",serif;font-size:24px;color:#EDF2F9;letter-spacing:3px;}
  #gridHead .prog{font-size:12px;color:var(--muted);font-family:Consolas,monospace;}
  #gridHead .spacer{flex:1;}
  #cards{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;
  }
  .card{
    background:#0B0F15;border:1px solid var(--line);border-radius:4px;overflow:hidden;
    cursor:pointer;transition:border-color .12s,transform .12s,box-shadow .12s;position:relative;
  }
  .card:hover{border-color:var(--clay);transform:translateY(-2px);box-shadow:0 14px 40px rgba(0,0,0,.6);}
  .card canvas{display:block;width:100%;aspect-ratio:16/9;background:#05070A;}
  .card .meta{padding:10px 12px 12px;display:flex;align-items:baseline;gap:9px;}
  .card .meta .n{font-size:14.5px;color:#E8EEF7;}
  .card .meta .i{font-family:Consolas,monospace;font-size:11px;color:var(--blue-pale);}
  .card .meta .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .card .ph{
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
    width:100%;aspect-ratio:16/9;background:
      repeating-linear-gradient(45deg,#0a0e14 0 10px,#0c1118 10px 20px);
    color:#516073;font-family:Consolas,monospace;font-size:12px;letter-spacing:1px;
  }
  .card .ph .spin{
    width:16px;height:16px;border:2px solid #2b3846;border-top-color:var(--clay);
    border-radius:50%;animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- 光源调试 ---------- */
  #lightPanel{
    position:absolute;top:14px;right:18px;width:320px;max-height:calc(100% - 28px);
    display:none;flex-direction:column;z-index:8;
    background:rgba(8,11,16,.97);border:1px solid var(--line);border-radius:5px;
    box-shadow:0 22px 70px rgba(0,0,0,.72);
  }
  #lightPanel.show{display:flex;}
  .lpHead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);}
  .lpHead .t{font-size:13px;color:#EDF2F9;letter-spacing:1px;white-space:nowrap;}
  .lpHead .id{font-family:Consolas,monospace;font-size:10.5px;color:var(--blue-pale);margin-left:auto;overflow:hidden;text-overflow:ellipsis;}
  .lpHead button{background:transparent;border:none;color:var(--muted);font-size:19px;line-height:1;cursor:pointer;padding:0 2px;}
  .lpHead button:hover{color:#fff;}
  .lpBody{overflow-y:auto;padding:4px 12px 8px;min-height:0;}
  .lpSec{font-size:10px;color:var(--muted);letter-spacing:1.6px;margin:9px 0 3px;text-transform:uppercase;}
  .lpRow{display:grid;grid-template-columns:1fr 27px;gap:3px 8px;align-items:center;padding:5px 0;border-bottom:1px dashed rgba(44,53,66,.42);}
  .lpRow .nm{font-size:12px;color:var(--text);min-width:0;display:flex;align-items:center;gap:6px;}
  .lpRow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lpRow input[type=color]{width:27px;height:21px;padding:0;border:1px solid var(--line);background:transparent;border-radius:3px;cursor:pointer;}
  .lpRow input[type=range]{grid-column:1/2;width:100%;height:13px;accent-color:var(--clay);cursor:pointer;}
  .lpRow .val{grid-column:2/3;grid-row:2;font-family:Consolas,monospace;font-size:10.5px;color:var(--muted);text-align:right;white-space:nowrap;}
  .lpFoot{padding:7px 12px 9px;border-top:1px solid var(--line);}
  .lpFoot .bar{display:flex;align-items:center;gap:8px;}
  .lpFoot .bar .btn{padding:5px 10px;font-size:12px;}
  #lightCopyState{font-size:11px;color:var(--muted);}
  details.lpJson{margin-top:5px;}
  details.lpJson summary{font-size:11px;color:var(--muted);cursor:pointer;letter-spacing:.5px;user-select:none;}
  details.lpJson summary:hover{color:var(--text);}
  #lightJson{display:none;width:100%;height:112px;margin-top:5px;background:#0B0F15;color:#A8BCFF;
    border:1px solid var(--line);border-radius:3px;padding:6px 7px;font-family:Consolas,monospace;
    font-size:10.5px;line-height:1.45;resize:vertical;white-space:pre;overflow:auto;}
  #lightJson.show{display:block;}
  body.clean #lightPanel{display:none;}

  #fail{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(4,6,9,.96);z-index:12;text-align:center;padding:40px;
  }
  #fail.show{display:flex;}
  #fail .box{max-width:620px;}
  #fail h2{font-family:"Noto Serif SC",serif;font-size:26px;color:#E8EEF7;margin-bottom:14px;letter-spacing:2px;}
  #fail p{font-size:14px;line-height:1.9;color:#98A6B8;}
  #fail code{font-family:Consolas,monospace;background:#131922;padding:1px 6px;border-radius:3px;color:#A8BCFF;}
</style>
</head>
<body>

<header>
  <h1>Escape <b>A÷</b> · 3D 场景预览</h1>
  <span class="sub">程序化背景 · WebGL2 · 零素材</span>
  <span class="spacer"></span>
  <button class="btn" id="btnPost" title="模拟游戏里的 2D 后期：调色 / 暗角 / 颗粒">游戏后期</button>
  <button class="btn" id="btnSim" title="切到游戏真实的合成路径 ART.paint：3D 层节流 + 画质档 + 2D 后期 + 立绘占位卡。切过去读到的 FPS 才和游戏里是一个量级">游戏合成</button>
  <select id="selQuality" title="3D 画质档，和游戏设置面板里的一致">
    <option value="0">画质 自动</option>
    <option value="1">画质 低</option>
    <option value="2">画质 中</option>
    <option value="3">画质 高</option>
  </select>
  <select id="selSprites" title="游戏合成模式下叠加的立绘占位卡数量（占位卡的绘制成本是真金白银）">
    <option value="0">无立绘</option>
    <option value="1">单立绘</option>
    <option value="2">双立绘</option>
  </select>
  <button class="btn" id="btnLights" title="调所有光源的颜色/亮度，复制 JSON">光影</button>
  <button class="btn" id="btnAuto" title="每 8 秒切下一个场景">自动轮播</button>
  <button class="btn" id="btnGrid" title="一次看全部场景">全部场景</button>
  <button class="btn" id="btnClean" title="隐藏 UI，只看画面（Esc 退出）">纯净模式</button>
</header>

<main>
  <aside id="side">
    <div class="groupTitle">序章</div>
    <div id="sideA"></div>
    <div class="groupTitle">后面的章节</div>
    <div id="sideB"></div>
  </aside>

  <section id="view">
    <div id="frame">
      <canvas id="stage" width="1600" height="900"></canvas>
      <div id="caption">
        <div class="t"><span id="capName"></span><code id="capId"></code></div>
        <div class="d" id="capDesc"></div>
      </div>
    </div>

    <div id="lightPanel" aria-label="光源调试">
      <div class="lpHead">
        <div class="t">光源调试</div>
        <div class="id" id="lightScene">—</div>
        <button id="lightClose" title="关闭">×</button>
      </div>
      <div class="lpBody" id="lightRows"></div>
      <div class="lpFoot">
        <div class="bar">
          <button class="btn" id="lightCopy" title="复制当前所有光源的 JSON">复制 JSON</button>
          <span id="lightCopyState"></span>
        </div>
        <details class="lpJson">
          <summary>查看 JSON</summary>
          <textarea id="lightJson" readonly spellcheck="false"></textarea>
        </details>
      </div>
    </div>

    <div id="grid">
      <div id="gridHead">
        <div class="ttl">全部场景</div>
        <div class="prog" id="gridProg"></div>
        <div class="spacer"></div>
        <button class="btn" id="btnGridClose">回到画面</button>
      </div>
      <div id="cards"></div>
    </div>

    <div id="fail">
      <div class="box">
        <h2>这台浏览器开不了 WebGL2</h2>
        <p>
          3D 背景需要 WebGL2（Chrome / Edge / Firefox 新版本默认就有）。<br>
          游戏里遇到这种情况会自动回落到「占位卡」，不会卡住剧情；<br>
          但预览页只能看到这块提示。<br><br>
          诊断信息：<code id="failWhy"></code>
        </p>
      </div>
    </div>
  </section>
</main>

<div id="perfBadge">—</div>

<div id="status">
  <span>WebGL2 <b id="stGl">检查中…</b></span>
  <span>FPS <b id="stFps">—</b></span>
  <span>场景 <b id="stInfo">—</b></span>
  <span>画布 <b id="stGain">1.00x</b></span>
  <span>合成 <b id="stPaint">—</b></span>
  <span>AA <b id="stAA">—</b></span>
  <span class="keys">拖拽旋转 · Shift/右键平移 · 滚轮缩放 · WASD 移动 · Q/E 升降 · R 重置 · 1–9 直选 · L 光影</span>
</div>

<script src="src/art.js?v=109"></script>
<script>
"use strict";
/* ============================================================
 *  Escape A÷ · art-preview.html —— 3D 场景预览（开发用，不进游戏）
 *
 * 直接双击打开即可（file:// 可用）：加载和游戏同一套 src/art3d/，
 * 挨个渲染所有注册过的场景，方便调光、调构图、看帧率。
 * 游戏里的背景查找顺序是 素材图 → 3D 场景 → 占位卡，这里只看 3D 这一层。
 * ============================================================ */

const SCENES = [
  { id: "sea",            name: "深海 / 标题画面",        desc: "光柱、鱼群、远处鲸影；标题画面和被水淹没的梦。", group: "序章" },
  { id: "ds_room",        name: "DeepSeek 家里",          desc: "紧凑的蓝色卧室兼工作室：床、两张桌子（靠墙那张给小克留着）、深海的窗；桌前滚动的训练日志与 loss 曲线，右墙白板上两条曲线。", group: "序章", post: false },
  { id: "claude_door",    name: "Claude 庄园 · 门（白天）", desc: "石门套、橡木门、紧闭的百叶窗、常春藤，门口石池里的橙色菊花。", group: "序章" },
  { id: "claude_door_403",name: "Claude 庄园 · 403",      desc: "同一扇门被 403 封住：门上巨大的 403，中间的 0 是空心的。", group: "序章" },
  { id: "claude_lib",     name: "Claude 家里 · 藏书室",   desc: "四面书架、长桌、吊灯、梯子与地球仪，书架上插着菊花。序章第二课在这里——DeepSeek 上门学写信。", group: "序章" },
  { id: "hf_camp",        name: "Hugging Face · 营地",    desc: "海边营地（夜）：帐篷群、篝火、串灯、月亮和海面。", group: "后面的章节" },
  { id: "github_street",  name: "GitHub · 夜市",          desc: "摊位与店招、灯笼、屎山和上面爬来爬去的甲虫。", group: "后面的章节" },
  { id: "nvidia",         name: "NVIDIA · 机房",          desc: "两排机柜、闪烁的绿灯、转动的风扇、尽头的大门。", group: "后面的章节" },
  { id: "shit_mountain",  name: "屎山",                   desc: "堆积如山的遗留代码：山坡上挂满祖传注释的旧屏幕（TODO、改 1 行炸 47 处、上一任没交接、git blame 全是我），两块屏平时安静、偶尔闪一下红色报错，坡面贴着胶带补丁；山旁一尊鎏金佛祖结跏趺坐，山脚「禁止重构」警告牌与「负责人：已离职」小牌，意大利面条电缆拖到山脚，两拨甲虫与苍蝇环绕。暂未接入剧情。", group: "独立场景" },
  { id: "ui_backdrop",    name: "界面底衬",               desc: "聊天 / 新闻这类全屏界面背后的安静底衬。", group: "后面的章节" }
];

const W = 1600, H = 900;
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
let cur = 0;
let showPost = true;
let autoRotate = false;
let autoTimer = 0;
const thumbs = {};       // id -> canvas（480×270）
let thumbBusy = false, thumbAll = false;

const $ = id => document.getElementById(id);

/* ---------------- 自由相机（轨道 + 平移 + 缩放 + WASD） ---------------- */
let orbit = null, defaultCam = null, needInit = true;
let drag = null;
const held = {};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function initOrbit(cam) {
  if (!cam || !cam.eye || !cam.target) return;
  const ex = cam.eye[0] - cam.target[0];
  const ey = cam.eye[1] - cam.target[1];
  const ez = cam.eye[2] - cam.target[2];
  const dist = Math.max(0.4, Math.hypot(ex, ey, ez));
  defaultCam = { eye: cam.eye.slice(), target: cam.target.slice(), fov: cam.fov || 50 };
  orbit = {
    target: cam.target.slice(),
    yaw: Math.atan2(ex, ez),
    pitch: Math.asin(clamp(ey / dist, -1, 1)),
    dist: dist,
    fov: cam.fov || 50
  };
}
function camFromOrbit() {
  const cp = Math.cos(orbit.pitch);
  return {
    eye: [
      orbit.target[0] + Math.sin(orbit.yaw) * cp * orbit.dist,
      orbit.target[1] + Math.sin(orbit.pitch) * orbit.dist,
      orbit.target[2] + Math.cos(orbit.yaw) * cp * orbit.dist
    ],
    target: orbit.target.slice(),
    fov: orbit.fov
  };
}
function resetOrbit() {
  if (defaultCam) initOrbit(defaultCam);
}
function moveOrbit(dt) {
  if (!orbit) return;
  const speed = 2.8 * Math.min(0.05, Math.max(0, dt));
  const sy = Math.sin(orbit.yaw), cy = Math.cos(orbit.yaw);
  let dx = 0, dy = 0, dz = 0;
  if (held.w) { dx -= sy; dz -= cy; }
  if (held.s) { dx += sy; dz += cy; }
  if (held.d) { dx += cy; dz -= sy; }
  if (held.a) { dx -= cy; dz += sy; }
  if (held.q) dy += 1;
  if (held.e) dy -= 1;
  orbit.target[0] = clamp(orbit.target[0] + dx * speed, -12, 12);
  orbit.target[1] = clamp(orbit.target[1] + dy * speed, 0.15, 3.4);
  orbit.target[2] = clamp(orbit.target[2] + dz * speed, -12, 12);
}


/* ---------------- 2D 后期：和游戏 art.js 的 post() 保持一致 ---------------- */
function post2d(c, id) {
  const tone = (typeof A3D !== "undefined" && A3D.toneOf(id)) || TONES.cold;
  c.save();
  c.globalCompositeOperation = "multiply";
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, tone[0]);
  g.addColorStop(0.55, tone[1]);
  g.addColorStop(1, tone[2]);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = "source-over";
  const vg = c.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 1.02);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(2,4,8,.40)");
  c.fillStyle = vg; c.fillRect(0, 0, W, H);
  c.globalAlpha = 0.05;
  for (let i = 0; i < 160; i++) {
    c.fillStyle = Math.random() < 0.5 ? "#000" : "#fff";
    c.fillRect(Math.random() * W, Math.random() * H, 1.6, 1.6);
  }
  c.restore();
}
const TONES = { cold: ["rgb(196,214,255)", "rgb(222,228,240)", "rgb(200,208,226)"] };

/* ---------------- 光源调试 ---------------- */
let lightPanelOpen = false, lightDirty = true;
const rgbToHex = c => "#" + [0, 1, 2].map(i => Math.round(clamp(c[i] || 0, 0, 1) * 255).toString(16).padStart(2, "0")).join("");
const hexToRgb = h => {
  const v = String(h || "#ffffff").replace("#", "");
  return [0, 2, 4].map(i => parseInt(v.slice(i, i + 2), 16) / 255);
};
const r3 = n => Math.round((Number(n) || 0) * 1000) / 1000;
const vec3 = c => [r3(c[0]), r3(c[1]), r3(c[2])];

function lightRow(label, color, min, max, step, value, fmt, onColor, onValue) {
  const row = document.createElement("div");
  row.className = "lpRow";
  const nm = document.createElement("div");
  nm.className = "nm";
  const sp = document.createElement("span");
  sp.textContent = label;
  nm.appendChild(sp);
  const col = document.createElement("input");
  col.type = "color"; col.value = rgbToHex(color);
  const range = document.createElement("input");
  range.type = "range"; range.min = min; range.max = max; range.step = step; range.value = value;
  const val = document.createElement("div");
  val.className = "val"; val.textContent = fmt(+value);
  row.append(nm, col, range, val);
  col.addEventListener("input", () => { onColor(hexToRgb(col.value)); updateLightJson(); });
  range.addEventListener("input", () => { val.textContent = fmt(+range.value); onValue(+range.value); updateLightJson(); });
  return row;
}

function buildLightPanel(s) {
  if (!s) return;
  const host = $("lightRows");
  if (!host) return;
  host.innerHTML = "";
  const L = s.lights || {};
  $("lightScene").textContent = s.__id || (SCENES[cur] && SCENES[cur].id) || "—";
  const sec = t => {
    const d = document.createElement("div");

  };
  sec("环境 / 方向光");
  [["sunCol", "太阳"], ["skyCol", "天光"], ["groundCol", "地面反弹"]].forEach(([key, label]) => {
    let base = (L[key] || [1, 1, 1]).slice();
    let mult = 1;
    const apply = () => { L[key] = base.map(v => clamp(v * mult, 0, 4)); };
    host.appendChild(lightRow(label, base, 0, 2, 0.01, 1, v => "×" + v.toFixed(2),
      c => { base = c; apply(); },
      v => { mult = v; apply(); }));
  });
  const pts = L.points || [];
  if (pts.length) {
    sec("点光源");
    pts.forEach((p, i) => {
      const col = (p.col || [1, 1, 1]).slice();
      const inten = p.inten === undefined ? 1 : p.inten;
      host.appendChild(lightRow(p.name || ("点光 " + (i + 1)), col, 0, 3, 0.01, inten, v => v.toFixed(2),
        c => { p.col = c; },
        v => { p.inten = v; }));
    });
  }
  if (s.tone) {
    sec("后期色调");
    let base = s.tone.slice();
    let strength = 1;
    const apply = () => { s.tone = base.map(v => 1 + (v - 1) * strength); };
    host.appendChild(lightRow("色调", base, 0, 1, 0.01, 1, v => v.toFixed(2),
      c => { base = c; apply(); },
      v => { strength = v; apply(); }));
  }
  updateLightJson();
}

function currentLightJson() {
  const s = (typeof A3D !== "undefined" && A3D.debugScene) ? A3D.debugScene() : null;
  if (!s) return "{}";
  const L = s.lights || {};
  const out = {
    scene: s.__id || (SCENES[cur] && SCENES[cur].id) || "",
    sun: vec3(L.sun || [0, 1, 0]),
    sunCol: vec3(L.sunCol || [0, 0, 0]),
    skyCol: vec3(L.skyCol || [0, 0, 0]),
    groundCol: vec3(L.groundCol || [0, 0, 0]),
    points: (L.points || []).map((p, i) => ({
      name: p.name || ("点光 " + (i + 1)),
      pos: vec3(p.pos || [0, 0, 0]),
      col: vec3(p.col || [1, 1, 1]),
      inten: r3(p.inten === undefined ? 1 : p.inten),
      range: r3(p.range === undefined ? 5 : p.range)

}
function updateLightJson() {

}
async function copyLightJson() {

function drawFrame(t) {
  const sc = SCENES[cur];

    /* 状态栏每帧算一次字符串、只在变了才写 DOM：以前是无条件 textContent 赋值，
     * 每帧一次强制重排，弱机上看 FPS 时它自己也是一份开销。 */
    const scaleTxt = (typeof A3D.renderScale === "number") ? A3D.renderScale.toFixed(2) : "1.00";
    setStatus(sc.id + " · " + (v / 1000).toFixed(0) + "k 顶点 · " +
      (s.dyn ? s.dyn.length : 0) + " 动态 · 缩放 " + scaleTxt + "（" + qName + "）");
    if (lightPanelOpen && lightDirty) { buildLightPanel(s); lightDirty = false; }

/* ============================================================
 *  游戏合成模拟
 *
 *  上面那条 drawFrame 是「原始 3D 路径」——固定 1600×900、每帧都 A3D.draw、
 *  不做 3D 层节流，所以它天生吃不到 art.js / engine.js 那边的优化。
 *  想测「游戏里到底多少帧」，必须走同一条链路：
 *
 *    engine.frame  →  ART.paint  →  layer3d  →  A3D.draw
 *                       ↑ 画质档 / 3D 节流 / 2D 后期 / 立绘占位卡全在这一层
 *
 *  这里就把 ART.paint 直接拉起来，vis 由页面上的选择器喂。
 *  画布尺寸也照抄 engine.sizeCanvas 的算法（s × dpr，夹在 [1, 1.5]），
 *  这样读到的数字才和游戏里可比。
 * ============================================================ */
let simOn = false;
let simGain = 1;
let simQuality = 0;              // 0 自动 / 1 低 / 2 中 / 3 高
let simSprites = 0;              // 0 无 / 1 单立绘 / 2 双立绘
const simVis = { bg: "ds_room", sprites: [], cg: null, glitch: 0 };
const QNAMES = ["自动", "低", "中", "高"];

/** 照抄 engine.sizeCanvas：后备存储按「CSS 尺寸 / 1600 × dpr」放大 */
let simSized = false;
function simSizeCanvas() {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const gain = Math.max(1, Math.min(1.5, r.width > 0 ? (r.width / W) * dpr : 1));
  /* 用独立标志判断"量过没有"，别拿 cv.width 当条件：gain 恰好 1.00 时旧写法会早退，
   * ART.setFrameScale 收不到通知；而且它还会在每次 resize 时白清一遍画布。 */
  if (simSized && Math.abs(gain - simGain) < 0.01) return;
  simSized = true;
  simGain = gain;
  cv.width = Math.round(W * gain);
  cv.height = Math.round(H * gain);
  ctx.setTransform(gain, 0, 0, gain, 0, 0);
  if (typeof ART !== "undefined" && ART.setFrameScale) ART.setFrameScale(gain);
  $("stGain").textContent = gain.toFixed(2) + "x";
}

function applyQuality() {
  if (typeof ART === "undefined" || !ART.setQuality) return;
  ART.setQuality(simQuality);
}

function setSim(on) {
  if (on && (typeof ART === "undefined" || typeof A3D === "undefined" || !A3D.ok)) return;
  simOn = !!on;
  if (simOn) {
    A3D.clearCamOverride();            // 游戏里没有自由相机，合成模式也不该有
    if (ART.setPerf) ART.setPerf(true);   // 让 paint 报耗时
    simSizeCanvas();
    applyQuality();
  } else {
    cv.width = W; cv.height = H;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (typeof ART !== "undefined" && ART.setFrameScale) ART.setFrameScale(1);
    needInit = true;                   // 回原始路径时重新拿一次场景默认相机
    lastStatus = ""; lastBadge = "";
  }
  $("btnSim").classList.toggle("on", simOn);
  $("btnPost").disabled = simOn;       // 合成模式的后期由 ART 自己决定
  syncPostButton();
  $("stGain").textContent = (simOn ? simGain : 1).toFixed(2) + "x";
}

/** 布局/视口一变就重新量画布。纯净模式切换、转屏、DPR 变化都走这里。 */
function refit() {
  if (simOn) simSizeCanvas();
  else $("stGain").textContent = "1.00x";
}

function simSpritesFor() {
  if (!simSprites) return [];
  const out = [{ who: "clawd", face: "normal", pos: simSprites === 2 ? "left" : "center", scale: 1 }];
  if (simSprites === 2) out.push({ who: "claude", face: "normal", pos: "right", scale: 1 });
  return out;
}

function simFrame(t) {
  if (typeof ART === "undefined" || !ART.paint) return;
  const sc = SCENES[cur];
  simVis.bg = sc.id;
  simVis.sprites = simSpritesFor();
  ART.paint(ctx, simVis, t, null);
  const s = A3D.debugScene();
  if (s) {
    let v = 0;
    (s.batches || []).forEach(b => { v += b.mesh ? b.mesh.count : 0; });
    setStatus(sc.id + " · " + (v / 1000).toFixed(0) + "k 顶点 · 合成路径");
    if (lightPanelOpen && lightDirty) { buildLightPanel(s); lightDirty = false; }
  }
}

/* ---------------- 帧循环 + FPS ---------------- */
let last = performance.now(), fpsN = 0, fpsT = 0;
let lastStatus = "", lastBadge = "";
function setStatus(txt) {
  if (txt === lastStatus) return;
  lastStatus = txt;
  const el = document.getElementById("stInfo");
  if (el) el.textContent = txt;
}
/** 纯净模式（和 ?perf=1）看的角标：两行，够用就行 */
function setBadge(fps, gainTxt, detail) {
  const txt = "FPS " + fps + "   画布 " + gainTxt + "\n" + detail;
  if (txt === lastBadge) return;
  lastBadge = txt;
  const el = $("perfBadge");
  if (el) el.textContent = txt;
}
function loop(now) {
  const t = now / 1000;
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  if (!simOn) moveOrbit(dt);
  if (simOn) simFrame(t); else drawFrame(t);
  fpsN++;
  if (now - fpsT > 500) {
    const fps = Math.round(fpsN * 1000 / (now - fpsT));
    $("stFps").textContent = fps;
    if (simOn && typeof ART !== "undefined") {
      const t3 = ART.getTier ? ART.getTier() : 1;
      const gainTxt = simGain.toFixed(2) + "x";
      const tail = QNAMES[t3] + (ART.autoTier ? "(自动)" : "") +
        " · 3D " + (ART.hz3d ? ART.hz3d + "Hz" : "每帧") +
        " · 缩放 " + (A3D.renderScale || 1).toFixed(2);
      $("stGain").textContent = gainTxt;
      $("stPaint").textContent = (ART.lastCostMs || 0).toFixed(1) + "ms · " + tail;
      setBadge(fps, gainTxt, "合成 " + (ART.lastCostMs || 0).toFixed(1) + "ms · " + tail);
    } else {
      const scaleTxt = (typeof A3D.renderScale === "number") ? A3D.renderScale.toFixed(2) : "1.00";
      $("stGain").textContent = "1.00x";
      $("stPaint").textContent = "原始路径 · 缩放 " + scaleTxt;
      setBadge(fps, "1.00x", "原始路径 · 缩放 " + scaleTxt + "（" + qName + "）");
    }
    fpsN = 0; fpsT = now;
  }
  if (autoRotate && autoTimer && now - autoTimer > 8000) {
    autoTimer = now;
    select(cur + 1);
  }
  last = now;
  requestAnimationFrame(loop);
}

/* ---------------- 全部场景缩略图 ---------------- */
const off = document.createElement("canvas");
off.width = W; off.height = H;
const offCtx = off.getContext("2d");

function makeCard(sc, i) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.idx = i;
  const th = thumbs[sc.id];
  if (th) {
    const c = document.createElement("canvas");

    '<div class="d">' + sc.desc + '</div></div>' +
    '<span class="i" style="margin-left:auto">' + sc.id + '</span>';
  card.appendChild(meta);
  card.addEventListener("click", () => {
    select(i);
    closeGrid();
  });
  return card;
}
function renderCards() {
  const host = $("cards");
  host.innerHTML = "";
  SCENES.forEach((sc, i) => host.appendChild(makeCard(sc, i)));
}
function fillThumb(sc) {
  offCtx.clearRect(0, 0, W, H);
  if (A3D.clearCamOverride) A3D.clearCamOverride();
  if (!A3D.draw(offCtx, sc.id, 2.4)) return false;
  const s0 = A3D.debugScene();
  if (s0 && s0.__cam0 && A3D.setCamOverride) {
    A3D.setCamOverride(s0.__cam0);
    A3D.draw(offCtx, sc.id, 2.4);
    A3D.clearCamOverride();
  }
  if (showPost && sc.post !== false) post2d(offCtx, sc.id);
  const th = document.createElement("canvas");
  th.width = 480; th.height = 270;
  th.getContext("2d").drawImage(off, 0, 0, 480, 270);
  thumbs[sc.id] = th;
  const cards = document.querySelectorAll("#cards .card");
  for (const card of cards) {
    if (card.dataset.idx === String(SCENES.indexOf(sc))) {
      const cv2 = document.createElement("canvas");
      cv2.width = 480; cv2.height = 270;
      cv2.getContext("2d").drawImage(th, 0, 0);
      const ph = card.querySelector(".ph");
      if (ph) card.replaceChild(cv2, ph);
      else card.insertBefore(cv2, card.firstChild);
    }
  }
  return true;
}
async function buildThumbs() {
  if (thumbBusy) return;
  thumbBusy = true; thumbAll = true;
  const todo = SCENES.filter(s => !thumbs[s.id]);
  for (let k = 0; k < todo.length; k++) {
    $("gridProg").textContent = "渲染中 " + (k + 1) + " / " + todo.length + " …";
    await new Promise(r => setTimeout(r, 30));
    try { fillThumb(todo[k]); } catch (e) { console.error("缩略图失败", todo[k].id, e); }
  }
  $("gridProg").textContent = "全部完成 · " + SCENES.length + " 个场景";
  thumbBusy = false; thumbAll = false;
}

$("btnClean").addEventListener("click", () => {
  const clean = document.body.classList.toggle("clean");
  $("btnClean").classList.toggle("on", clean);
  if (clean) closeLightPanel();
  /* 纯净模式改的是 CSS，#frame 会从「带边距的框」变成整屏铺满——
   * 这不是 window.resize，光靠 resize 监听画布倍率会停在旧值。
   * ResizeObserver 也会来一发，但那是异步的，这里先同步量一次。 */
  refit();
});
window.addEventListener("keydown", e => {
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key, kl = k.toLowerCase();
  if (kl === "l") { toggleLightPanel(); return; }
  if (k === "ArrowLeft") { if (orbit) orbit.yaw += 0.08; e.preventDefault(); return; }
  if (k === "ArrowRight") { if (orbit) orbit.yaw -= 0.08; e.preventDefault(); return; }
  if (k === "ArrowUp") { if (orbit) orbit.pitch = clamp(orbit.pitch + 0.06, -1.45, 1.45); e.preventDefault(); return; }
  if (k === "ArrowDown") { if (orbit) orbit.pitch = clamp(orbit.pitch - 0.06, -1.45, 1.45); e.preventDefault(); return; }
  if (kl === "r") { resetOrbit(); return; }
  if (kl === "w" || kl === "a" || kl === "s" || kl === "d" || kl === "q" || kl === "e") {
    held[kl] = true;
    return;
  }
  if (k === "g" || k === "G") {
    $("grid").classList.contains("show") ? closeGrid() : openGrid();
  }
  else if (k === "h" || k === "H") { $("btnClean").click(); }
  /* P：临时收起 / 放回纯净模式下的调试角标（截图要干净画面时用） */
  else if (k === "p" || k === "P") { document.body.classList.toggle("hide-perf"); }
  else if (k === "Escape") {
    if (lightPanelOpen) closeLightPanel();
    else if ($("grid").classList.contains("show")) closeGrid();
    else if (document.body.classList.contains("clean")) $("btnClean").click();
  }
  else if (k === " ") {
    e.preventDefault();
    $("btnAuto").click();
  }
  else if (/^[1-9]$/.test(k)) {
    const i = +k - 1;
    if (i < SCENES.length) select(i);
  }
});
window.addEventListener("keyup", e => {
  const kl = e.key.toLowerCase();
  if (kl in held) held[kl] = false;
});
window.addEventListener("blur", () => { for (const k in held) held[k] = false; });

/* 自由相机：画布上拖拽旋转 / Shift 或右键平移，滚轮缩放（不再切场景） */
cv.addEventListener("pointerdown", e => {
  if (!orbit) return;
  drag = { mode: (e.button === 0 && !e.shiftKey) ? "orbit" : "pan", x: e.clientX, y: e.clientY };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
cv.addEventListener("pointermove", e => {
  if (!drag || !orbit) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.mode === "orbit") {
    orbit.yaw -= dx * 0.0035;
    orbit.pitch = clamp(orbit.pitch + dy * 0.0035, -1.45, 1.45);
    return;
  }
  const cp = Math.cos(orbit.pitch);
  const f = [-Math.sin(orbit.yaw) * cp, -Math.sin(orbit.pitch), -Math.cos(orbit.yaw) * cp];
  const r = [Math.cos(orbit.yaw), 0, -Math.sin(orbit.yaw)];
  const up = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  const scale = orbit.dist * 0.0016;
  orbit.target[0] += -r[0] * dx * scale + up[0] * dy * scale;
  orbit.target[1] += -r[1] * dx * scale + up[1] * dy * scale;
  orbit.target[2] += -r[2] * dx * scale + up[2] * dy * scale;
});
cv.addEventListener("pointerup", e => {
  drag = null;
  try { cv.releasePointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener("pointercancel", () => { drag = null; });
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("wheel", e => {
  if (!orbit) return;
  e.preventDefault();
  orbit.dist = clamp(orbit.dist * Math.exp(e.deltaY * 0.0011), 0.7, 17);
}, { passive: false });

/* ---------------- 画质档位 ----------------
 * 两种模式各有各的用法：
 *   · 原始路径（默认）——美术调试要看真东西：1600×900 全分辨率、每帧都 A3D.draw。
 *     这里直接改 A3D 的渲染倍率/阴影，不动 ART。
 *   · 游戏合成（右上角「游戏合成」按钮）——完全交给 ART.setQuality，
 *     和游戏设置面板里那个滑条走的是同一段代码。
 * ?q=low|mid|high|auto 两个模式都认，?sim=1 直接进合成模式。 */
const RAW_QUALITY = { low: [0.6, 512, 4], mid: [0.85, 1024, 8], high: [1, 0, 8] };
let qName = "high";
function parseQualityParam() {
  const raw = (new URLSearchParams(location.search).get("q") || "").toLowerCase();
  const map = { low: 1, mid: 2, high: 3, auto: 0, "1": 1, "2": 2, "3": 3, "0": 0 };
  const v = map[raw];
  simQuality = v === undefined ? 0 : v;
  qName = simQuality ? ["", "low", "mid", "high"][simQuality] : "auto";
}
/** 原始路径下直接改 A3D（合成模式由 ART.setQuality 接管） */
function applyRawQuality() {
  const key = simQuality ? ["", "low", "mid", "high"][simQuality] : "high";
  const [scale, cap, taps] = RAW_QUALITY[key];
  if (typeof A3D !== "undefined" && A3D.setRenderScale) {
    A3D.setRenderScale(scale);
    A3D.setShadowQuality(cap, taps);
  }
}

/* ---------------- 启动 ---------------- */
function boot() {
  buildSide();
  const start = SCENES.findIndex(s => s.id === "ds_room");
  select(start >= 0 ? start : 0);
  if (typeof A3D !== "undefined") A3D.init();      // 先建上下文，A3D.ok 才有意义
  if (typeof A3D === "undefined" || !A3D.ok) {
    $("fail").classList.add("show");
    $("failWhy").textContent = (typeof A3D === "undefined")
      ? "A3D 未定义：src/art3d/*.js 没加载"
      : (A3D.failReason || "未知原因");
    $("stGl").textContent = "不可用";
    $("stGl").className = "bad";
    return;
  }
  $("stGl").textContent = "可用";
  $("stGl").className = "ok";
  /* 抗锯齿信息：MSAA 是浏览器给的（antialias:true 只是请求），
   * A2C = 镂空材质走 alpha-to-coverage，需要 MSAA 才生效。 */
  if ($("stAA")) {
    $("stAA").textContent = A3D.samples > 1
      ? A3D.samples + "x" + (A3D.alphaToCoverage ? " + A2C" : "")
      : "无（浏览器没给 MSAA）";
    $("stAA").className = A3D.samples > 1 ? "ok" : "bad";
  }
  parseQualityParam();
  $("selQuality").value = String(simQuality);
  /* 调试角标：纯净模式下默认显示（画面留空但读数还在）；
     ?perf=1 让非纯净模式也显示，?perf=0 彻底关掉，P 键临时切换。 */
  const perfQ = (new URLSearchParams(location.search).get("perf") || "").toLowerCase();
  if (perfQ === "1" || perfQ === "true" || perfQ === "on") document.body.classList.add("want-perf");
  if (perfQ === "0" || perfQ === "false" || perfQ === "off") document.body.classList.add("hide-perf");
  bindSimControls();
  applyRawQuality();                 // 原始模式先按 ?q= 落一次
  syncPostButton();
  if (new URLSearchParams(location.search).has("sim")) setSim(true);
  /* 画布倍率要在这些时机都重算：窗口缩放、转屏、手机地址栏收放、拖到别的显示器、
   * 以及任何改变 #frame 尺寸的布局变化（纯净模式就是这一类）。
   * ResizeObserver 兜住最后那一类；前面几个是它观测不到的。 */
  window.addEventListener("resize", refit);
  window.addEventListener("orientationchange", () => setTimeout(refit, 60));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", refit);
  if (window.ResizeObserver) new ResizeObserver(refit).observe($("frame"));
  (function watchDpr() {
    if (!window.matchMedia) return;
    const mq = window.matchMedia("(resolution: " + (window.devicePixelRatio || 1) + "dppx)");
    const onChange = () => { refit(); watchDpr(); };
    if (mq.addEventListener) mq.addEventListener("change", onChange, { once: true });
    else if (mq.addListener) mq.addListener(() => { refit(); watchDpr(); });
  })();
  requestAnimationFrame(t => { fpsT = t; loop(t); });
}

/* ---------------- 合成模式的控件 ---------------- */
function bindSimControls() {
  $("btnSim").addEventListener("click", () => setSim(!simOn));
  $("selQuality").addEventListener("change", e => {
    simQuality = +e.target.value | 0;
    if (simOn) applyQuality(); else applyRawQuality();
    lastStatus = "";                 // 让状态栏下一帧重画
  });
  $("selSprites").addEventListener("change", e => { simSprites = +e.target.value | 0; });
}
boot();
</script>
</body>
